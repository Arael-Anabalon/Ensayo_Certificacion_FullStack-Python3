{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">{{ peluche.nombre }}</h2>
                <p class="fs-5"><strong>Dueño:</strong> {{ peluche.creador_nombre }}</p>
                <p class="fs-5"><strong>Descripción:</strong> {{ peluche.descripcion }}</p>

                <table class="table table-bordered mt-4">
                    <tbody>
                        <tr>
                            <th class="table-light w-25">Adoptado por:</th>
                            <td>
                                {% if peluche.adoptador_id %}
                                {{ peluche.adoptador_nombre }}
                                {% else %}
                                <span class="text-muted">Disponible</span>
                                {% endif %}
                            </td>
                        </tr>
                        <tr>
                            <th class="table-light">Visitas:</th>
                            <td class="fw-bold">{{ peluche.vistas }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
